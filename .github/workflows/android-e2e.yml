name: "MoneyMap Android E2E · Enterprise Automation & CI/CD"

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_smoke_only:
        description: "Run smoke tests only (faster)"
        required: false
        default: "false"
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write
  pages:    write
  id-token: write
  actions:  read

# ─── Concurrency (prevent overlapping deployments) ────────────────────────────
concurrency:
  group:  "pages-${{ github.ref }}"
  cancel-in-progress: false

# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  build-and-test:
    name: "Build APK · Emulator · Appium · 510+ Tests · Reports"
    runs-on: macos-13        # Intel runner required for HVF nested-virtualization
    timeout-minutes: 90

    env:
      JAVA_VERSION:        "21"
      NODE_VERSION:        "18"
      ANDROID_API:         "35"
      ANDROID_TARGET:      "google_apis"
      ANDROID_ARCH:        "x86_64"
      APPIUM_VERSION:      "latest"
      RESULTS_DIR:         "automation/Test Results"
      REPORTS_DIR:         "automation/reports"
      DEPLOY_DIR:          "deploy_reports"

    steps:
      # ── Stage 1: Checkout ────────────────────────────────────────────────────
      - name: "Stage 1 · Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Stage 2: Setup Java ──────────────────────────────────────────────────
      - name: "Stage 2 · Setup Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache:        gradle

      # ── Stage 3: Setup Node.js ───────────────────────────────────────────────
      - name: "Stage 3 · Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Stage 4: Setup Android SDK ───────────────────────────────────────────
      - name: "Stage 4 · Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # ── Stage 5: Make Gradle executable ─────────────────────────────────────
      - name: "Stage 5 · Make Gradle Wrapper Executable"
        run: chmod +x ./gradlew

      # ── Stage 6: Build Debug APK ─────────────────────────────────────────────
      - name: "Stage 6 · Build Debug APK"
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      # ── Stage 7: Verify APK ──────────────────────────────────────────────────
      - name: "Stage 7 · Verify APK Exists"
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi
          echo "✅ APK verified: $(ls -lh $APK_PATH)"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      # ── Stage 8-13: Emulator + Appium + Tests ────────────────────────────────
      - name: "Stage 8–13 · Launch Emulator → Install Appium → Run 510+ Tests"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level:         ${{ env.ANDROID_API }}
          target:            ${{ env.ANDROID_TARGET }}
          arch:              ${{ env.ANDROID_ARCH }}
          disable-animations: true
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -memory 2048

          script: |
            set -e

            # ── Create directories ─────────────────────────────────────────
            mkdir -p "${{ env.REPORTS_DIR }}/screenshots"
            mkdir -p "${{ env.REPORTS_DIR }}/logs"
            mkdir -p "${{ env.RESULTS_DIR }}/Excel"
            mkdir -p "${{ env.RESULTS_DIR }}/HTML"
            mkdir -p "${{ env.RESULTS_DIR }}/JSON"
            mkdir -p "${{ env.RESULTS_DIR }}/Summary"

            # ── Stage 8: Wait for emulator ─────────────────────────────────
            echo "⏳ Waiting for emulator to fully boot..."
            adb wait-for-device
            BOOT_STATUS=""
            RETRIES=0
            while [[ "$BOOT_STATUS" != "1" && $RETRIES -lt 60 ]]; do
              BOOT_STATUS=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              sleep 3
              RETRIES=$((RETRIES + 1))
            done
            if [[ "$BOOT_STATUS" != "1" ]]; then
              echo "❌ Emulator did not boot in time"
              exit 1
            fi
            echo "✅ Emulator booted (attempt $RETRIES)"
            adb shell input keyevent 82
            adb devices

            # ── Stage 9: Install APK ───────────────────────────────────────
            echo "📦 Installing MoneyMap APK..."
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo "✅ APK installed: com.example.moneymap"

            # ── Stage 10: Install Appium ───────────────────────────────────
            echo "🔧 Installing Appium and UIAutomator2 driver..."
            npm install -g appium@${{ env.APPIUM_VERSION }}
            appium driver install uiautomator2
            echo "✅ Appium installed: $(appium --version)"

            # ── Stage 11: Start Appium Server ──────────────────────────────
            echo "🚀 Starting Appium server..."
            appium \
              --log "${{ env.REPORTS_DIR }}/logs/appium-server.log" \
              --log-level info \
              --relaxed-security \
              &
            APPIUM_PID=$!
            echo "Appium PID: $APPIUM_PID"

            # ── Stage 12: Verify Appium health ─────────────────────────────
            echo "⏳ Waiting for Appium to be ready..."
            APPIUM_READY=false
            for i in $(seq 1 30); do
              if curl -s http://127.0.0.1:4723/status | grep -q '"ready":true'; then
                APPIUM_READY=true
                echo "✅ Appium is ready (attempt $i)"
                break
              fi
              sleep 2
            done
            if [ "$APPIUM_READY" != "true" ]; then
              echo "❌ Appium failed to start"
              cat "${{ env.REPORTS_DIR }}/logs/appium-server.log" || true
              exit 1
            fi
            curl -s http://127.0.0.1:4723/status | python3 -m json.tool | head -20

            # ── Stage 13: Execute E2E Test Suite ───────────────────────────
            echo "🧪 Executing 510+ E2E test cases..."
            cd automation
            mvn clean test \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -Dmaven.test.failure.ignore=true \
              --no-transfer-progress \
              2>&1 | tee "../${{ env.REPORTS_DIR }}/logs/mvn-execution.log"
            MVN_EXIT=$?
            cd ..
            echo "Maven exit code: $MVN_EXIT"

            # Kill Appium
            kill $APPIUM_PID 2>/dev/null || true
            echo "✅ Test execution complete"

      # ── Stage 14: Capture & Organize Reports ─────────────────────────────────
      - name: "Stage 14 · Organize Reports for Deployment"
        if: always()
        run: |
          echo "📊 Organizing reports..."
          RESULTS="${{ env.RESULTS_DIR }}"
          DEPLOY="${{ env.DEPLOY_DIR }}"
          BUILD="${{ github.run_number }}"

          mkdir -p "$DEPLOY/reports/latest"
          mkdir -p "$DEPLOY/reports/history/build-$BUILD"

          # Copy latest results
          for f in execution-report.html dashboard.html trends.html; do
            [ -f "$RESULTS/HTML/$f" ] && cp "$RESULTS/HTML/$f" "$DEPLOY/reports/latest/" || true
          done
          [ -f "$RESULTS/Summary/summary.md" ] && cp "$RESULTS/Summary/summary.md" "$DEPLOY/reports/latest/" || true
          [ -f "$RESULTS/JSON/execution-results.json" ] && cp "$RESULTS/JSON/execution-results.json" "$DEPLOY/reports/latest/" || true
          [ -d "${{ env.REPORTS_DIR }}/screenshots" ] && cp -r "${{ env.REPORTS_DIR }}/screenshots" "$DEPLOY/reports/latest/" || true
          [ -d "${{ env.REPORTS_DIR }}/logs" ] && cp -r "${{ env.REPORTS_DIR }}/logs" "$DEPLOY/reports/latest/" || true

          # Copy to history
          cp -r "$DEPLOY/reports/latest/." "$DEPLOY/reports/history/build-$BUILD/" 2>/dev/null || true

          # Generate the Pages index.html
          cat > "$DEPLOY/index.html" << 'INDEXEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=reports/latest/execution-report.html">
            <title>MoneyMap E2E Reports</title>
            <style>body{font-family:sans-serif;background:#0F172A;color:#F8FAFC;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}a{color:#3B82F6;}</style>
          </head>
          <body>
            <p>Redirecting to <a href="reports/latest/execution-report.html">latest report</a>...</p>
          </body>
          </html>
          INDEXEOF
          echo "✅ Reports organized"
          ls -la "$DEPLOY/reports/latest/" 2>/dev/null || echo "No files in latest dir"

      # ── Stage 15: Restore GitHub Pages history ────────────────────────────────
      - name: "Stage 15 · Restore Previous Build History"
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git clone \
            --branch gh-pages \
            --single-branch \
            --depth 10 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            gh-pages-clone 2>/dev/null || echo "No existing gh-pages branch"
          if [ -d "gh-pages-clone/reports/history" ]; then
            cp -r gh-pages-clone/reports/history/* "${{ env.DEPLOY_DIR }}/reports/history/" 2>/dev/null || true
            echo "✅ Previous history restored"
            ls "${{ env.DEPLOY_DIR }}/reports/history/" | tail -10
          fi

      # ── Stage 16: Deploy to GitHub Pages ────────────────────────────────────
      - name: "Stage 16 · Deploy Reports to GitHub Pages"
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch:      gh-pages
          folder:      ${{ env.DEPLOY_DIR }}
          clean:       false
          commit-message: "ci: deploy E2E reports for build #${{ github.run_number }} [${{ github.sha }}]"

      # ── Stage 17: Upload Artifacts ────────────────────────────────────────────
      - name: "Stage 17 · Upload Test Report Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name:              "MoneyMap-E2E-Reports-Build-${{ github.run_number }}"
          retention-days:    30
          if-no-files-found: warn
          path: |
            automation/Test Results/Excel/Automation_Test_Report.xlsx
            automation/Test Results/Excel/Passed_Test_Cases.xlsx
            automation/Test Results/Excel/Failed_Test_Cases.xlsx
            automation/Test Results/Excel/Execution_Summary.xlsx
            automation/Test Results/HTML/execution-report.html
            automation/Test Results/HTML/dashboard.html
            automation/Test Results/HTML/trends.html
            automation/Test Results/JSON/execution-results.json
            automation/Test Results/Summary/summary.md
            automation/reports/screenshots/
            automation/reports/logs/

      - name: "Stage 17b · Upload Appium Server Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name:              "Appium-Server-Logs-Build-${{ github.run_number }}"
          retention-days:    15
          if-no-files-found: ignore
          path: |
            automation/reports/logs/appium-server.log
            automation/reports/logs/mvn-execution.log

      # ── Stage 18: Publish GitHub Actions Summary ──────────────────────────────
      - name: "Stage 18 · Publish GitHub Actions Step Summary"
        if: always()
        run: |
          SUMMARY_FILE="automation/Test Results/Summary/summary.md"
          REPORT_URL="https://${{ github.repository_owner }}.github.io/$(echo '${{ github.repository }}' | cut -d'/' -f2)/reports/latest/execution-report.html"

          echo "## 📊 MoneyMap E2E Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Build** | #${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Actor** | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **App Package** | \`com.example.moneymap\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **APK Version** | \`v1.0\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Device** | Android ${{ env.ANDROID_API }} (x86_64) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Total Test Cases** | 510+ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📄 Live Report" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 [$REPORT_URL]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$SUMMARY_FILE" ]; then
            echo "### 📋 Detailed Results" >> "$GITHUB_STEP_SUMMARY"
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Detailed summary not available (may be first run)" >> "$GITHUB_STEP_SUMMARY"
          fi
