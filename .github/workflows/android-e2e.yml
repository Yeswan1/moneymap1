name: "MoneyMap Android E2E Automation and CI/CD Pipeline"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "Manual run"
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ANDROID_API_LEVEL: 35
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk
  APPIUM_PORT: 4723
  DATABASE_URL: "postgresql://moneymap:password@localhost:5432/moneymap?schema=public"
  JWT_ACCESS_SECRET: "moneymap-access-secret-change-in-production-minimum-32-characters"
  JWT_REFRESH_SECRET: "moneymap-refresh-secret-change-in-production-minimum-32-characters"
  JWT_ACCESS_EXPIRATION: "15m"
  JWT_REFRESH_EXPIRATION: "7d"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  NODE_ENV: "development"
  PORT: "3000"
  API_PREFIX: "api/v1"

jobs:
  build-and-test:
    name: "Build NestJS Postgres Emulator Appium 510 Tests Reports"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneymap
          POSTGRES_PASSWORD: password
          POSTGRES_DB: moneymap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: "Stage 1 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Make Gradle wrapper executable"
        run: chmod +x ./gradlew

      - name: "Stage 2 Setup Java 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: "Stage 3 Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            emulator
            system-images;android-35;google_apis;x86_64

      - name: "Stage 4 Setup Node.js 20 for Backend"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: "Stage 4b Install NestJS Backend Dependencies"
        run: |
          cd backend
          npm ci --prefer-offline || npm install
          echo "Backend dependencies installed"

      - name: "Stage 5 Run Prisma Migrations and Seed Database"
        run: |
          cd backend
          npx prisma generate
          npx prisma db push --skip-generate --accept-data-loss || npx prisma migrate deploy || echo "Migration warning continuing"
          npm run prisma:seed || npx ts-node prisma/seed.ts || node prisma/seed.js || echo "Seed warning continuing"
          echo "Database ready"

      - name: "Stage 6 Start NestJS Backend Server"
        run: |
          cd backend
          NODE_ENV=development PORT=3000 API_PREFIX=api/v1 \
          DATABASE_URL="${{ env.DATABASE_URL }}" \
          JWT_ACCESS_SECRET="${{ env.JWT_ACCESS_SECRET }}" \
          JWT_REFRESH_SECRET="${{ env.JWT_REFRESH_SECRET }}" \
          JWT_ACCESS_EXPIRATION=15m JWT_REFRESH_EXPIRATION=7d \
          REDIS_HOST=localhost REDIS_PORT=6379 REDIS_PASSWORD="" CORS_ORIGINS="*" \
          npm run start:dev &
          echo "NestJS dev server starting in background"
          cd ..

      - name: "Stage 7 Verify Backend Health"
        run: |
          echo "Waiting for NestJS backend..."
          TIMEOUT=120
          ELAPSED=0
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            for EP in "http://localhost:3000" "http://localhost:3000/api/v1/docs"; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "$EP" 2>/dev/null || echo "000")
              if echo "$CODE" | grep -qE "^[2345]"; then
                echo "Backend responding at $EP (HTTP $CODE) after ${ELAPSED}s"
                exit 0
              fi
            done
            sleep 3
            ELAPSED=$((ELAPSED + 3))
            echo "Waiting for backend... ${ELAPSED}s"
          done
          echo "Backend warmup exceeded timeout, continuing anyway"

      - name: "Stage 8 Enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "KVM enabled"

      - name: "Stage 9 Build Debug APK"
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon \
            -PMONEYMAP_API_BASE_URL="http://10.0.2.2:3000/api/v1/" \
            -Dorg.gradle.jvmargs="-Xmx4g"
          echo "APK built"

      - name: "Stage 10 Verify APK"
        run: |
          if [ ! -f "${{ env.APK_PATH }}" ]; then
            echo "APK not found"
            exit 1
          fi
          ls -lh "${{ env.APK_PATH }}"
          echo "APK_SIZE=$(du -sh ${{ env.APK_PATH }} | cut -f1)" >> $GITHUB_ENV
          echo "APK verified"

      - name: "Stage 11 Setup Node.js 18 for Appium"
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: "Stages 12-18 Emulator Appium 510 Tests Reports"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            set -e
            mkdir -p automation/reports/screenshots
            mkdir -p automation/reports/logs
            mkdir -p "automation/Test Results/Excel"
            mkdir -p "automation/Test Results/HTML"
            mkdir -p "automation/Test Results/JSON"
            mkdir -p "automation/Test Results/Summary"

            echo "Waiting for emulator to boot..."
            adb wait-for-device
            BOOT_TIMEOUT=180
            ELAPSED=0
            BOOTED=""
            while [ "$BOOTED" != "1" ]; do
              BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOTED" = "1" ]; then break; fi
              sleep 3
              ELAPSED=$((ELAPSED + 3))
              if [ "$ELAPSED" -ge "$BOOT_TIMEOUT" ]; then echo "Emulator boot timeout"; exit 1; fi
              echo "Booting... ${ELAPSED}s"
            done
            echo "Emulator booted after ${ELAPSED}s"
            adb shell input keyevent 82
            sleep 2
            adb devices

            echo "Installing APK..."
            adb install -r "${{ env.APK_PATH }}"
            adb shell pm list packages | grep moneymap || true
            echo "APK installed"

            echo "Installing Appium..."
            npm install -g appium@latest --loglevel=error
            appium driver install uiautomator2 --source npm
            echo "Appium installed"

            echo "Starting Appium server..."
            appium --port ${{ env.APPIUM_PORT }} \
              --log automation/reports/logs/appium-server.log \
              --log-level info --relaxed-security \
              > automation/reports/logs/appium-console.log 2>&1 &
            APPIUM_PID=$!

            echo "Waiting for Appium..."
            APPIUM_TIMEOUT=60
            APPIUM_ELAPSED=0
            APPIUM_READY=""
            while [ -z "$APPIUM_READY" ]; do
              if curl -sf "http://127.0.0.1:${{ env.APPIUM_PORT }}/status" > /dev/null 2>&1; then
                APPIUM_READY="yes"
                echo "Appium ready after ${APPIUM_ELAPSED}s"
                break
              fi
              sleep 2
              APPIUM_ELAPSED=$((APPIUM_ELAPSED + 2))
              if [ "$APPIUM_ELAPSED" -ge "$APPIUM_TIMEOUT" ]; then
                echo "Appium failed to start"
                cat automation/reports/logs/appium-console.log || true
                exit 1
              fi
              echo "Waiting for Appium... ${APPIUM_ELAPSED}s"
            done

            echo "Executing 510+ E2E Tests..."
            cd automation
            mvn clean test \
              -DGITHUB_RUN_NUMBER=${{ github.run_number }} \
              -DGITHUB_SHA=${{ github.sha }} \
              -DGITHUB_REF_NAME=${{ github.ref_name }} \
              -DANDROID_API_LEVEL=${{ env.ANDROID_API_LEVEL }} \
              -Dsurefire.useFile=false \
              -Dmaven.test.failure.ignore=true \
              --no-transfer-progress \
              2>&1 | tee "../automation/reports/logs/mvn-execution.log" || TEST_EXIT=$?
            echo "Maven exit code ${TEST_EXIT:-0}"
            cd ..

            echo "Capturing post-test evidence..."
            adb exec-out screencap -p > automation/reports/screenshots/post-test-device.png 2>/dev/null || true
            adb logcat -d -t 2000 > automation/reports/logs/adb-full-logcat.log 2>/dev/null || true
            cp automation/reports/logs/appium-server.log "automation/Test Results/Summary/" 2>/dev/null || true
            echo "Post-test evidence captured"

            if [ -n "$TEST_EXIT" ] && [ "$TEST_EXIT" -ne 0 ]; then
              echo "Tests failed with exit code $TEST_EXIT"
              exit "$TEST_EXIT"
            fi

      - name: "Stage 19a Upload Excel Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-Excel-Reports-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/Test Results/Excel/"

      - name: "Stage 19b Upload HTML Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-HTML-Reports-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/Test Results/HTML/"

      - name: "Stage 19c Upload JSON Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-JSON-Report-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/Test Results/JSON/"

      - name: "Stage 19d Upload Screenshots"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-Screenshots-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/reports/screenshots/"

      - name: "Stage 19e Upload Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-Logs-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/reports/logs/"

      - name: "Stage 19f Upload Summary and APK"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-Summary-APK-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: |
            automation/Test Results/Summary/
            ${{ env.APK_PATH }}

      - name: "Stage 20a Prepare GitHub Pages Deploy Structure"
        if: always()
        env:
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deploy_site/reports/latest
          mkdir -p "deploy_site/reports/history/build-${GH_RUN_NUMBER}"

          git clone --branch gh-pages --single-branch --depth=50 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}" \
            gh-pages-clone 2>/dev/null || echo "No existing gh-pages"
          if [ -d "gh-pages-clone/reports/history" ]; then
            cp -r gh-pages-clone/reports/history/* deploy_site/reports/history/ 2>/dev/null || true
          fi

          cp "automation/Test Results/HTML/execution-report.html" deploy_site/reports/latest/ 2>/dev/null || echo "execution-report.html not generated"
          cp "automation/Test Results/HTML/dashboard.html" deploy_site/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/HTML/trends.html" deploy_site/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/JSON/execution-results.json" deploy_site/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/Summary/summary.md" deploy_site/reports/latest/ 2>/dev/null || true
          cp -r automation/reports/screenshots deploy_site/reports/latest/ 2>/dev/null || true
          cp -r automation/reports/logs deploy_site/reports/latest/ 2>/dev/null || true

          cp "automation/Test Results/HTML/execution-report.html" "deploy_site/reports/history/build-${GH_RUN_NUMBER}/" 2>/dev/null || true
          cp "automation/Test Results/JSON/execution-results.json" "deploy_site/reports/history/build-${GH_RUN_NUMBER}/" 2>/dev/null || true
          cp "automation/Test Results/Summary/summary.md" "deploy_site/reports/history/build-${GH_RUN_NUMBER}/" 2>/dev/null || true

          python3 /dev/stdin << PYEOF
import os, glob, sys

bn   = os.environ.get("GH_RUN_NUMBER", "?")
br   = os.environ.get("GH_REF_NAME", "main")
sha  = os.environ.get("GH_SHA", "")[:8]
repo = os.environ.get("GH_REPOSITORY", "")
own  = os.environ.get("GH_REPO_OWNER", "")
rid  = os.environ.get("GH_RUN_ID", "")
rn   = repo.split("/")[-1] if "/" in repo else repo
act  = "https://github.com/" + repo + "/actions/runs/" + rid
ok   = os.path.exists("automation/Test Results/HTML/execution-report.html")

bc   = "#10B981" if ok else "#EF4444"
bt   = "Tests Completed" if ok else "Pipeline Incomplete"
msg  = ("Redirecting to latest report in 3 seconds..." if ok
        else "Tests did not complete. Check pipeline logs.")
red  = '<meta http-equiv="refresh" content="3; url=reports/latest/execution-report.html">' if ok else ""
cta  = ('<a href="reports/latest/execution-report.html">View Execution Report</a>' if ok
        else '<a href="' + act + '" target="_blank">View Pipeline Logs</a>')

html = (
    "<!DOCTYPE html><html lang=en><head>"
    "<meta charset=UTF-8>"
    "<meta name=viewport content='width=device-width,initial-scale=1.0'>"
    + red +
    "<title>MoneyMap E2E Reports Build " + bn + "</title>"
    "<style>"
    "*{box-sizing:border-box;margin:0;padding:0;}"
    "body{background:#0F172A;color:#F8FAFC;font-family:system-ui,sans-serif;"
    "display:flex;align-items:center;justify-content:center;min-height:100vh;}"
    ".card{background:#1E293B;border:1px solid #334155;border-radius:20px;"
    "padding:48px 40px;text-align:center;max-width:520px;width:90%;}"
    "h1{font-size:24px;font-weight:700;margin-bottom:10px;color:#60A5FA;}"
    ".badge{display:inline-block;background:" + bc + ";color:#fff;"
    "font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;margin-bottom:18px;}"
    ".meta{color:#64748B;font-size:13px;margin-bottom:20px;line-height:1.9;}"
    "b{color:#94A3B8;}"
    "p{color:#94A3B8;font-size:14px;margin-bottom:24px;}"
    "a{background:#3B82F6;color:#fff;text-decoration:none;padding:11px 26px;"
    "border-radius:10px;font-weight:600;display:inline-block;font-size:14px;}"
    "a:hover{background:#2563EB;}"
    "</style></head><body><div class=card>"
    "<h1>MoneyMap E2E Reports</h1>"
    "<div class=badge>" + bt + "</div>"
    "<div class=meta>Build <b>#" + bn + "</b> &middot; Branch <b>" + br + "</b><br>Commit <b>" + sha + "</b></div>"
    "<p>" + msg + "</p>" + cta +
    "</div></body></html>"
)
with open("deploy_site/index.html", "w") as f:
    f.write(html)

builds = sorted(glob.glob("deploy_site/reports/history/build-*/"), reverse=True)
items = "".join(
    "<li><a href='" + os.path.basename(b.rstrip("/")) + "/execution-report.html'>Report: " + os.path.basename(b.rstrip("/")) + "</a></li>"
    for b in builds
    if os.path.exists(b + "/execution-report.html")
) or "<li>No completed reports yet</li>"
hist = (
    "<!DOCTYPE html><html><head><meta charset=UTF-8><title>Build History</title>"
    "<style>body{background:#0F172A;color:#F8FAFC;font-family:system-ui,sans-serif;padding:32px;max-width:800px;margin:0 auto;}"
    "h1{color:#60A5FA;margin-bottom:24px;}ul{list-style:none;padding:0;}"
    "li{background:#1E293B;border:1px solid #334155;border-radius:10px;margin:8px 0;padding:14px 20px;}"
    "a{color:#60A5FA;text-decoration:none;font-weight:600;}a:hover{text-decoration:underline;}"
    "</style></head><body>"
    "<h1>MoneyMap Build History</h1><ul>" + items + "</ul>"
    "<p style='margin-top:20px'><a href='../latest/execution-report.html'>Latest Report</a></p>"
    "</body></html>"
)
with open("deploy_site/reports/history/index.html", "w") as f:
    f.write(hist)
print("HTML files written successfully")
PYEOF

          find deploy_site -name "*.html" | head -20

      - name: "Stage 20b Deploy Reports to GitHub Pages"
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy_site
          clean: false
          commit-message: "E2E Report Build ${{ github.run_number }} ${{ github.sha }}"

      - name: "Stage 21 Publish GitHub Actions Summary"
        if: always()
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d/ -f2)
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/reports/latest/execution-report.html"
          SUMMARY_FILE="automation/Test Results/Summary/summary.md"

          echo "## MoneyMap Android Appium E2E Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Build Number** | #${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Date** | $(date '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **APK Size** | ${{ env.APK_SIZE }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Device** | Android ${{ env.ANDROID_API_LEVEL }} Emulator x86_64 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test Cases** | 510+ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Live Report** | ${REPORT_URL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Test summary not generated — check Logs artifact for mvn-execution.log" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Summary published"
