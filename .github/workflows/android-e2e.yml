name: Android E2E Appium Automation & CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and Run Mobile E2E Tests
    runs-on: macos-13 # REQUIRED: Intel-based runner is required for nested virtualization (HVF) support
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Configured to match compileSdk 35 and targetSdk 35 in app/build.gradle.kts
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Launch Emulator & Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35 # Matches targetSdk 35
          target: google_apis
          arch: x86_64 # Matches Intel architecture of macos-13 host for hardware acceleration
          disable-animations: true
          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none

          script: |
            # 1. Setup logs folders
            mkdir -p automation/reports/logs
            mkdir -p automation/reports/screenshots

            echo "Installing Appium..."
            npm install -g appium
            appium driver install uiautomator2

            echo "Starting Appium..."
            appium --log appium.log > appium-console.log 2>&1 &

            echo "Waiting for Appium..."
            for i in {1..30}; do
              if curl -s http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium started."
                break
              fi
              sleep 2
            done

            pgrep -f appium

            echo "Waiting for emulator..."
            adb wait-for-device

            until [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; do
              sleep 5
            done

            adb shell input keyevent 82

            echo "Installing APK..."
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            adb devices

            cd automation
            mvn clean test

      - name: Prepare Reports for GitHub Pages
        if: always()
        run: |
          mkdir -p deploy_reports/reports/latest
          mkdir -p deploy_reports/reports/history/build-${{ github.run_number }}

          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages-branch || true

          if [ -d "gh-pages-branch/reports/history" ]; then
            cp -r gh-pages-branch/reports/history/* deploy_reports/reports/history/ || true
          fi

          cp "automation/Test Results/HTML/execution-report.html" deploy_reports/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/HTML/dashboard.html" deploy_reports/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/Summary/summary.md" deploy_reports/reports/latest/ 2>/dev/null || true

          cp -r automation/reports/screenshots deploy_reports/reports/latest/ 2>/dev/null || true
          cp -r automation/reports/logs deploy_reports/reports/latest/ 2>/dev/null || true

          mkdir -p deploy_reports/reports/history/build-${{ github.run_number }}

          cp "automation/Test Results/HTML/execution-report.html" deploy_reports/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true
          cp -r automation/reports/screenshots deploy_reports/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true
          cp -r automation/reports/logs deploy_reports/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true

      - name: Deploy Reports
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy_reports

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMap-E2E-Test-Reports
          path: automation/Test Results/
          retention-days: 30

      - name: Upload Appium Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: |
            appium.log
            appium-console.log

      - name: Publish Job Summary
        if: always()
        run: |
          if [ -f "automation/Test Results/Summary/summary.md" ]; then
            cat "automation/Test Results/Summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Android Appium E2E Summary Missing" >> "$GITHUB_STEP_SUMMARY"
          fi
