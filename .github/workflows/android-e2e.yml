name: "MoneyMap Android E2E Automation and CI/CD Pipeline"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "Manual run"
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ANDROID_API_LEVEL: 35
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk
  APPIUM_PORT: 4723
  DATABASE_URL: "postgresql://moneymap:password@localhost:5432/moneymap?schema=public"
  JWT_ACCESS_SECRET: "moneymap-access-secret-change-in-production-minimum-32-characters"
  JWT_REFRESH_SECRET: "moneymap-refresh-secret-change-in-production-minimum-32-characters"
  JWT_ACCESS_EXPIRATION: "15m"
  JWT_REFRESH_EXPIRATION: "7d"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  NODE_ENV: "development"
  PORT: "3000"
  API_PREFIX: "api/v1"

jobs:
  # ============================================================
  # JOB 1: Build the Debug APK once
  # ============================================================
  build-apk:
    name: "Build Debug APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Make Gradle wrapper executable"
        run: chmod +x ./gradlew

      - name: "Setup Java 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: "Build Debug APK"
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -PMONEYMAP_API_BASE_URL="http://10.0.2.2:3000/api/v1/" \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: "Verify and Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: moneymap-debug-apk
          path: ${{ env.APK_PATH }}
          retention-days: 1

  # ============================================================
  # JOB 2: Run tests in parallel matrix shards
  # ============================================================
  run-tests:
    name: "Shard: ${{ matrix.shard }}"
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [auth, dashboard, transactions, budget, settings, reports]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneymap
          POSTGRES_PASSWORD: password
          POSTGRES_DB: moneymap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Download Built APK"
        uses: actions/download-artifact@v4
        with:
          name: moneymap-debug-apk
          path: app/build/outputs/apk/debug/

      - name: "Setup Java 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            emulator
            system-images;android-35;google_apis;x86_64

      - name: "Setup Node.js 20.19"
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: "Install NestJS Backend Dependencies"
        run: |
          cd backend
          npm ci --prefer-offline || npm install
          echo "Backend dependencies installed"

      - name: "Run Prisma Migrations and Seed"
        run: |
          cd backend
          npx prisma generate
          npx prisma db push --skip-generate --accept-data-loss || npx prisma migrate deploy
          npm run prisma:seed || npx ts-node prisma/seed.ts || echo "Seed warning"

      - name: "Start NestJS Backend"
        run: |
          cd backend
          NODE_ENV=development \
          PORT=3000 \
          API_PREFIX=api/v1 \
          DATABASE_URL="${{ env.DATABASE_URL }}" \
          JWT_ACCESS_SECRET="${{ env.JWT_ACCESS_SECRET }}" \
          JWT_REFRESH_SECRET="${{ env.JWT_REFRESH_SECRET }}" \
          JWT_ACCESS_EXPIRATION=15m \
          JWT_REFRESH_EXPIRATION=7d \
          REDIS_HOST=localhost \
          REDIS_PORT=6379 \
          REDIS_PASSWORD="" \
          CORS_ORIGINS="*" \
          npm run start:dev > /tmp/nestjs.log 2>&1 &
          echo "NestJS dev server starting in background"
          cd ..

      - name: "Verify Backend Health"
        run: |
          echo "Waiting for NestJS backend..."
          TIMEOUT=120
          ELAPSED=0
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000" 2>/dev/null || echo "000")
            if echo "$CODE" | grep -qE "^[2345]"; then
              echo "Backend healthy (HTTP $CODE) after ${ELAPSED}s"
              exit 0
            fi
            sleep 3
            ELAPSED=$((ELAPSED + 3))
          done
          echo "Backend did not respond in time"
          exit 1

      - name: "Enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "KVM enabled"

      - name: "Execute Shard Emulator Tests"
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ env.APK_PATH }}
          APPIUM_PORT: ${{ env.APPIUM_PORT }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          ANDROID_API_LEVEL: ${{ env.ANDROID_API_LEVEL }}
          TEST_SHARD: ${{ matrix.shard }}
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            chmod +x automation/.github-scripts/run-e2e-tests.sh
            automation/.github-scripts/run-e2e-tests.sh

      - name: "Rename and Prepare Shard Artifacts"
        if: always()
        run: |
          if [ -f "automation/Test Results/JSON/execution-results.json" ]; then
            mv "automation/Test Results/JSON/execution-results.json" "automation/Test Results/JSON/execution-results-${{ matrix.shard }}.json"
          fi
          # Copy screenshots and logs under Test Results directory to upload them together
          mkdir -p "automation/Test Results/screenshots"
          mkdir -p "automation/Test Results/logs"
          cp -r automation/reports/screenshots/* "automation/Test Results/screenshots/" 2>/dev/null || true
          cp -r automation/reports/logs/* "automation/Test Results/logs/" 2>/dev/null || true

      - name: "Upload Shard Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-results-${{ matrix.shard }}
          path: automation/Test Results/
          retention-days: 1

  # ============================================================
  # JOB 3: Consolidate reports and publish
  # ============================================================
  consolidate-reports:
    name: "Consolidate and Publish Reports"
    needs: run-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Java 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: "Create report directories"
        run: |
          mkdir -p all-json
          mkdir -p automation/reports/screenshots
          mkdir -p automation/reports/logs
          mkdir -p "automation/Test Results"

      - name: "Download Shard Auth"
        uses: actions/download-artifact@v4
        with:
          name: shard-results-auth
          path: temp-auth
        continue-on-error: true

      - name: "Download Shard Dashboard"
        uses: actions/download-artifact@v4
        with:
          name: shard-results-dashboard
          path: temp-dashboard
        continue-on-error: true

      - name: "Download Shard Transactions"
        uses: actions/download-artifact@v4
        with:
          name: shard-results-transactions
          path: temp-transactions
        continue-on-error: true

      - name: "Download Shard Budget"
        uses: actions/download-artifact@v4
        with:
          name: shard-results-budget
          path: temp-budget
        continue-on-error: true

      - name: "Download Shard Settings"
        uses: actions/download-artifact@v4
        with:
          name: shard-results-settings
          path: temp-settings
        continue-on-error: true

      - name: "Download Shard Reports"
        uses: actions/download-artifact@v4
        with:
          name: shard-results-reports
          path: temp-reports
        continue-on-error: true

      - name: "Merge Shard Artifact Folders"
        run: |
          # Copy JSONs to all-json folder
          find temp-* -name "execution-results-*.json" -exec cp {} all-json/ \; || true
          
          # Copy screenshots and logs to active report directories
          find temp-* -path "*/screenshots/*" -exec cp -r {} automation/reports/ \; || true
          find temp-* -path "*/logs/*" -exec cp -r {} automation/reports/ \; || true
          
          # Show what was collected
          echo "JSON files to merge:"
          ls -l all-json/ || true

      - name: "Compile and Run ReportMerger"
        run: |
          cd automation
          mvn compile exec:java \
            -Dexec.mainClass="com.example.moneymap.automation.reporting.ReportMerger" \
            -Dexec.args="../all-json ../automation/Test Results"

      - name: "Zip Consolidate Reports"
        run: |
          zip -r reports.zip "automation/Test Results/"
          echo "Merged reports packaged"

      - name: "Upload Merged Reports Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-Consolidated-Reports-Build-${{ github.run_number }}"
          path: reports.zip
          retention-days: 30
          if-no-files-found: error

      - name: "Stage Deploy to GitHub Pages"
        env:
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deploy_site/reports/latest
          mkdir -p "deploy_site/reports/history/build-${GH_RUN_NUMBER}"

          git clone \
            --branch gh-pages \
            --single-branch \
            --depth=50 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}" \
            gh-pages-clone 2>/dev/null || echo "No existing gh-pages branch"

          if [ -d "gh-pages-clone/reports/history" ]; then
            cp -r gh-pages-clone/reports/history/* deploy_site/reports/history/ 2>/dev/null || true
          fi

          cp "automation/Test Results/HTML/execution-report.html" deploy_site/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/HTML/dashboard.html"        deploy_site/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/HTML/trends.html"           deploy_site/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/JSON/execution-results.json" deploy_site/reports/latest/ 2>/dev/null || true
          cp -r automation/reports/screenshots                     deploy_site/reports/latest/ 2>/dev/null || true
          cp -r automation/reports/logs                            deploy_site/reports/latest/ 2>/dev/null || true

          cp "automation/Test Results/HTML/execution-report.html" "deploy_site/reports/history/build-${GH_RUN_NUMBER}/" 2>/dev/null || true
          cp "automation/Test Results/JSON/execution-results.json" "deploy_site/reports/history/build-${GH_RUN_NUMBER}/" 2>/dev/null || true

          chmod +x automation/.github-scripts/generate-pages.py
          python3 automation/.github-scripts/generate-pages.py || echo "No custom pages script ran"

      - name: "Deploy to GitHub Pages"
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy_site
          clean: false
          commit-message: "Consolidated E2E Report Build ${{ github.run_number }} ${{ github.sha }}"

      - name: "Publish Step Summary"
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d/ -f2)
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/reports/latest/execution-report.html"
          {
            echo "## MoneyMap Consolidated E2E Execution Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| **Build Number** | #${{ github.run_number }} |"
            echo "| **Live HTML Report** | [Open Consolidated Report](${REPORT_URL}) |"
            echo "| **Git Branch** | ${{ github.ref_name }} |"
            echo "| **Git Commit** | ${{ github.sha }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
