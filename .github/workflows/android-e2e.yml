name: Android E2E Appium Automation & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2:00 AM UTC

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and Run Mobile E2E Tests
    runs-on: macos-13 # macos runner is required for hardware-accelerated Android Emulator (nested virtualization)
    timeout-minutes: 45 # Job-level timeout guard to prevent run hangs
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Targets compileSdk 35 and targetSdk 35 matching app/build.gradle.kts
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk was not generated successfully."
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully verified."

      - name: Start Appium, Launch Android Emulator & Run E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35 # Matches project target SDK 35
          target: google_apis
          arch: x86_64 # Matches Intel architecture of macos-13 host for virtualization
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # 1. Prepare reports/logs folder structure
            mkdir -p automation/reports/logs
            mkdir -p automation/reports/screenshots
            
            # 2. Install Appium Server and register UiAutomator2 driver
            npm install -g appium
            appium driver install uiautomator2
            
            # 3. Start Appium server in background and write logs directly to the report logs folder
            appium --log automation/reports/logs/appium.log &
            
            # Wait for Appium Server to start
            echo "Waiting for Appium Server..."
            for i in {1..30}; do
              if curl -s http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium Server is up and healthy!"
                break
              fi
              sleep 2
            done
            
            # 4. Verify ADB detects the booted emulator successfully and wait for boot completion
            echo "Verifying booted emulator in ADB..."
            adb devices
            adb wait-for-device
            
            # 5. Pre-install APK on Emulator to avoid Appium session timeout
            echo "Pre-installing APK on emulator..."
            adb install app/build/outputs/apk/debug/app-debug.apk
            
            # 6. Run Appium tests
            cd automation
            mvn clean test

      - name: Prepare Reports for GitHub Pages
        if: always()
        run: |
          # Create temporary deployment directory matching requested Pages structure
          mkdir -p deploy_reports/reports/latest
          mkdir -p deploy_reports/reports/history/build-${{ github.run_number }}
          
          # Clone existing gh-pages branch to preserve history
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages-branch || true
          
          if [ -d "gh-pages-branch/reports/history" ]; then
            echo "Archiving historical reports..."
            cp -r gh-pages-branch/reports/history/* deploy_reports/reports/history/ || true
          else
            echo "No gh-pages history branch found."
          fi
          
          # Copy execution reports only if they exist
          if [ -f "automation/Test Results/HTML/execution-report.html" ]; then
            cp "automation/Test Results/HTML/execution-report.html" deploy_reports/reports/latest/
            cp "automation/Test Results/HTML/dashboard.html" deploy_reports/reports/latest/ || true
          else
            echo "execution-report.html not found; skipping copy."
          fi
          
          if [ -f "automation/Test Results/Summary/summary.md" ]; then
            cp "automation/Test Results/Summary/summary.md" deploy_reports/reports/latest/
          else
            echo "summary.md not found; skipping copy."
          fi
          
          # Copy screenshots and logs
          if [ -d "automation/reports/screenshots" ]; then
            cp -r automation/reports/screenshots deploy_reports/reports/latest/
            cp -r automation/reports/screenshots deploy_reports/reports/history/build-${{ github.run_number }}/ || true
          fi
          
          if [ -d "automation/reports/logs" ]; then
            cp -r automation/reports/logs deploy_reports/reports/latest/
            cp -r automation/reports/logs deploy_reports/reports/history/build-${{ github.run_number }}/ || true
          fi
          
          # Copy index html to history for the specific build if it exists
          if [ -f "automation/Test Results/HTML/execution-report.html" ]; then
            cp "automation/Test Results/HTML/execution-report.html" deploy_reports/reports/history/build-${{ github.run_number }}/
          fi

      - name: Publish Reports to GitHub Pages
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy_reports

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMap-E2E-Test-Reports
          path: automation/Test Results/
          retention-days: 30

      - name: Publish GitHub Action Job Summary
        if: always()
        run: |
          if [ -f "automation/Test Results/Summary/summary.md" ]; then
            cat "automation/Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "# Android Appium E2E Execution - Summary File Missing" >> $GITHUB_STEP_SUMMARY
          fi
