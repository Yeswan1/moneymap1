name: "🤖 MoneyMap Android E2E Automation & CI/CD Pipeline"

# ══════════════════════════════════════════════════════════════
# ENTERPRISE-GRADE MOBILE AUTOMATION + BACKEND + REPORTING
# ══════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "Manual run"
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ANDROID_API_LEVEL: 35
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk
  APPIUM_PORT: 4723
  DATABASE_URL: "postgresql://moneymap:password@localhost:5432/moneymap?schema=public"
  JWT_ACCESS_SECRET: "moneymap-access-secret-change-in-production-minimum-32-characters"
  JWT_REFRESH_SECRET: "moneymap-refresh-secret-change-in-production-minimum-32-characters"
  JWT_ACCESS_EXPIRATION: "15m"
  JWT_REFRESH_EXPIRATION: "7d"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  NODE_ENV: "development"
  PORT: "3000"
  API_PREFIX: "api/v1"

jobs:
  build-and-test:
    name: "🚀 Build · NestJS · Postgres · Emulator · Appium · 510 Tests · Reports"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneymap
          POSTGRES_PASSWORD: password
          POSTGRES_DB: moneymap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # ── Stage 1: Checkout ────────────────────────────────────────────────────
      - name: "📦 Stage 1 · Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔧 Make Gradle wrapper executable"
        run: chmod +x ./gradlew

      # ── Stage 2: Java ────────────────────────────────────────────────────────
      - name: "☕ Stage 2 · Setup Java 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ── Stage 3: Android SDK ─────────────────────────────────────────────────
      - name: "🤖 Stage 3 · Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            emulator
            system-images;android-35;google_apis;x86_64

      # ── Stage 4: Node.js + Backend ───────────────────────────────────────────
      - name: "🌱 Stage 4 · Setup Node.js 20 + Install Backend Dependencies"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: "📥 Stage 4b · Install NestJS Backend Dependencies"
        run: |
          cd backend
          npm ci --prefer-offline || npm install
          echo "✅ Backend dependencies installed"

      # ── Stage 5: Prisma ──────────────────────────────────────────────────────
      - name: "🗄️ Stage 5 · Run Prisma Migrations & Seed Database"
        run: |
          cd backend
          echo "Generating Prisma client..."
          npx prisma generate

          echo "Running DB migrations..."
          npx prisma db push --skip-generate --accept-data-loss || \
          npx prisma migrate deploy || \
          echo "⚠️ Migration warning — continuing"

          echo "Seeding database..."
          npm run prisma:seed || \
          npx ts-node prisma/seed.ts || \
          node prisma/seed.js || \
          echo "⚠️ Seed warning — continuing"

          echo "✅ Database ready"

      # ── Stage 6: Start Backend (dev mode — no build step needed) ─────────────
      - name: "🚀 Stage 6 · Start NestJS Backend Server"
        run: |
          cd backend
          NODE_ENV=development \
          PORT=3000 \
          API_PREFIX=api/v1 \
          DATABASE_URL="${{ env.DATABASE_URL }}" \
          JWT_ACCESS_SECRET="${{ env.JWT_ACCESS_SECRET }}" \
          JWT_REFRESH_SECRET="${{ env.JWT_REFRESH_SECRET }}" \
          JWT_ACCESS_EXPIRATION=15m \
          JWT_REFRESH_EXPIRATION=7d \
          REDIS_HOST=localhost \
          REDIS_PORT=6379 \
          REDIS_PASSWORD="" \
          CORS_ORIGINS="*" \
          npm run start:dev &
          echo "NestJS dev server starting in background..."
          cd ..

      # ── Stage 7: Verify Backend Health ───────────────────────────────────────
      - name: "✅ Stage 7 · Verify Backend Health"
        run: |
          echo "Waiting for NestJS backend..."
          TIMEOUT=120
          ELAPSED=0
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")
            if echo "$STATUS" | grep -qE '^[2345]'; then
              echo "✅ Backend responding (HTTP $STATUS) after ${ELAPSED}s"
              break
            fi
            STATUS2=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/docs 2>/dev/null || echo "000")
            if echo "$STATUS2" | grep -qE '^[2345]'; then
              echo "✅ Backend docs responding (HTTP $STATUS2) after ${ELAPSED}s"
              break
            fi
            sleep 3
            ELAPSED=$((ELAPSED + 3))
            echo "  ⏳ Waiting for backend... ${ELAPSED}s"
          done
          echo "Backend check complete (continuing regardless)"

      # ── Stage 8: Enable KVM ───────────────────────────────────────────────────
      - name: "⚡ Stage 8 · Enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "✅ KVM enabled"

      # ── Stage 9: Build APK ────────────────────────────────────────────────────
      - name: "🔨 Stage 9 · Build Debug APK"
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -PMONEYMAP_API_BASE_URL="http://10.0.2.2:3000/api/v1/" \
            -Dorg.gradle.jvmargs="-Xmx4g"
          echo "✅ APK built"

      # ── Stage 10: Verify APK ──────────────────────────────────────────────────
      - name: "✅ Stage 10 · Verify APK"
        run: |
          if [ ! -f "${{ env.APK_PATH }}" ]; then
            echo "❌ APK not found"
            exit 1
          fi
          echo "✅ APK verified:"
          ls -lh "${{ env.APK_PATH }}"
          echo "APK_SIZE=$(du -sh ${{ env.APK_PATH }} | cut -f1)" >> $GITHUB_ENV

      # ── Stage 11: Node.js 18 for Appium ──────────────────────────────────────
      - name: "📥 Stage 11 · Setup Node.js 18 for Appium"
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ── Stages 12–18: Emulator + Appium + Tests ───────────────────────────────
      # NOTE: android-emulator-runner executes script lines via /usr/bin/sh (dash),
      # NOT bash. All syntax must be POSIX sh compatible:
      #   ✅ Use [ ] not [[ ]]
      #   ✅ Use = not == in test expressions
      #   ✅ No bash-specific until/while with [[ ]]
      - name: "📱 Stages 12–18 · Emulator + Appium + 510 Tests + Reports"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -memory 2048

          script: |
            set -e

            echo "=== Creating output directories ==="
            mkdir -p automation/reports/screenshots
            mkdir -p automation/reports/logs
            mkdir -p "automation/Test Results/Excel"
            mkdir -p "automation/Test Results/HTML"
            mkdir -p "automation/Test Results/JSON"
            mkdir -p "automation/Test Results/Summary"

            echo "=== Stage 12: Waiting for emulator to boot ==="
            adb wait-for-device
            BOOT_TIMEOUT=180
            ELAPSED=0
            BOOTED=""
            while [ "$BOOTED" != "1" ]; do
              BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOTED" = "1" ]; then
                echo "✅ Emulator booted after ${ELAPSED}s"
                break
              fi
              sleep 3
              ELAPSED=$((ELAPSED + 3))
              if [ "$ELAPSED" -ge "$BOOT_TIMEOUT" ]; then
                echo "❌ Emulator failed to boot within ${BOOT_TIMEOUT}s"
                exit 1
              fi
              echo "  ⏳ Booting... ${ELAPSED}s"
            done
            adb shell input keyevent 82
            sleep 2
            adb devices

            echo "=== Stage 13: Installing APK ==="
            adb install -r "${{ env.APK_PATH }}"
            adb shell pm list packages | grep moneymap || true
            echo "✅ APK installed"

            echo "=== Stage 14: Installing Appium ==="
            npm install -g appium@latest --loglevel=error
            appium driver install uiautomator2 --source npm
            echo "✅ Appium installed: $(appium --version)"

            echo "=== Stage 15: Starting Appium server ==="
            appium \
              --port ${{ env.APPIUM_PORT }} \
              --log automation/reports/logs/appium-server.log \
              --log-level info \
              --relaxed-security \
              > automation/reports/logs/appium-console.log 2>&1 &
            APPIUM_PID=$!
            echo "Appium PID: $APPIUM_PID"

            echo "=== Stage 16: Verifying Appium health ==="
            APPIUM_TIMEOUT=60
            APPIUM_ELAPSED=0
            APPIUM_READY=""
            while [ -z "$APPIUM_READY" ]; do
              if curl -sf http://127.0.0.1:${{ env.APPIUM_PORT }}/status > /dev/null 2>&1; then
                APPIUM_READY="yes"
                echo "✅ Appium ready after ${APPIUM_ELAPSED}s"
                break
              fi
              sleep 2
              APPIUM_ELAPSED=$((APPIUM_ELAPSED + 2))
              if [ "$APPIUM_ELAPSED" -ge "$APPIUM_TIMEOUT" ]; then
                echo "❌ Appium failed to start"
                cat automation/reports/logs/appium-console.log || true
                exit 1
              fi
              echo "  ⏳ Waiting for Appium... ${APPIUM_ELAPSED}s"
            done
            curl -s http://127.0.0.1:${{ env.APPIUM_PORT }}/status \
              | python3 -m json.tool 2>/dev/null | head -10 || true

            echo "=== Stage 17: Executing 510+ E2E Tests ==="
            echo "Build: #${{ github.run_number }} | Branch: ${{ github.ref_name }}"
            cd automation
            mvn clean test \
              -DGITHUB_RUN_NUMBER=${{ github.run_number }} \
              -DGITHUB_SHA=${{ github.sha }} \
              -DGITHUB_REF_NAME=${{ github.ref_name }} \
              -DANDROID_API_LEVEL=${{ env.ANDROID_API_LEVEL }} \
              -Dsurefire.useFile=false \
              -Dmaven.test.failure.ignore=true \
              --no-transfer-progress \
              2>&1 | tee "../automation/reports/logs/mvn-execution.log" \
              || TEST_EXIT=$?
            echo "Maven exit: ${TEST_EXIT:-0}"
            cd ..

            echo "=== Stage 18: Capturing post-test evidence ==="
            adb exec-out screencap -p \
              > automation/reports/screenshots/post-test-device.png 2>/dev/null || true
            adb logcat -d -t 2000 \
              > automation/reports/logs/adb-full-logcat.log 2>/dev/null || true
            adb logcat -d -t 500 "*:E" "moneymap:V" \
              > automation/reports/logs/adb-errors.log 2>/dev/null || true
            cp automation/reports/logs/appium-server.log \
               "automation/Test Results/Summary/" 2>/dev/null || true
            echo "✅ Post-test evidence captured"

            if [ -n "$TEST_EXIT" ] && [ "$TEST_EXIT" -ne 0 ]; then
              echo "❌ Tests failed with exit code $TEST_EXIT"
              exit "$TEST_EXIT"
            fi

      # ── Stage 19: Upload Artifacts ────────────────────────────────────────────
      - name: "📤 Stage 19a · Upload Excel Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-Excel-Reports-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/Test Results/Excel/"

      - name: "📤 Stage 19b · Upload HTML Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-HTML-Reports-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/Test Results/HTML/"

      - name: "📤 Stage 19c · Upload JSON Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-JSON-Report-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/Test Results/JSON/"

      - name: "📤 Stage 19d · Upload Screenshots"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-Screenshots-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/reports/screenshots/"

      - name: "📤 Stage 19e · Upload Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-Logs-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: "automation/reports/logs/"

      - name: "📤 Stage 19f · Upload Summary + APK"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "MoneyMap-Summary-APK-Build-${{ github.run_number }}"
          retention-days: 30
          if-no-files-found: warn
          path: |
            automation/Test Results/Summary/
            ${{ env.APK_PATH }}

      # ── Stage 20: GitHub Pages ────────────────────────────────────────────────
      - name: "🌐 Stage 20a · Prepare GitHub Pages Deploy Structure"
        if: always()
        run: |
          mkdir -p deploy_site/reports/latest
          mkdir -p "deploy_site/reports/history/build-${{ github.run_number }}"

          # Restore previous history
          git clone \
            --branch gh-pages \
            --single-branch \
            --depth=50 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            gh-pages-clone 2>/dev/null || echo "No existing gh-pages"
          if [ -d "gh-pages-clone/reports/history" ]; then
            cp -r gh-pages-clone/reports/history/* \
               deploy_site/reports/history/ 2>/dev/null || true
            echo "✅ Previous history restored"
          fi

          # Check if reports exist
          REPORT_EXISTS="false"
          [ -f "automation/Test Results/HTML/execution-report.html" ] && REPORT_EXISTS="true"

          # Copy latest reports
          cp "automation/Test Results/HTML/execution-report.html" \
             deploy_site/reports/latest/ 2>/dev/null || echo "⚠️ execution-report.html not generated"
          cp "automation/Test Results/HTML/dashboard.html" \
             deploy_site/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/HTML/trends.html" \
             deploy_site/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/JSON/execution-results.json" \
             deploy_site/reports/latest/ 2>/dev/null || true
          cp "automation/Test Results/Summary/summary.md" \
             deploy_site/reports/latest/ 2>/dev/null || true
          cp -r automation/reports/screenshots deploy_site/reports/latest/ 2>/dev/null || true
          cp -r automation/reports/logs deploy_site/reports/latest/ 2>/dev/null || true

          # Copy to history
          cp "automation/Test Results/HTML/execution-report.html" \
             "deploy_site/reports/history/build-${{ github.run_number }}/" 2>/dev/null || true
          cp "automation/Test Results/JSON/execution-results.json" \
             "deploy_site/reports/history/build-${{ github.run_number }}/" 2>/dev/null || true
          cp "automation/Test Results/Summary/summary.md" \
             "deploy_site/reports/history/build-${{ github.run_number }}/" 2>/dev/null || true

          # Determine status badge
          if [ "$REPORT_EXISTS" = "true" ]; then
            BADGE_COLOR="#10B981"
            BADGE_TEXT="Tests Completed"
            STATUS_MSG="Redirecting to latest execution report..."
            REDIRECT='<meta http-equiv="refresh" content="3; url=reports/latest/execution-report.html">'
            CTA='<a href="reports/latest/execution-report.html">View Execution Report</a>'
          else
            BADGE_COLOR="#EF4444"
            BADGE_TEXT="Pipeline Incomplete"
            STATUS_MSG="Tests did not run or reports were not generated. Check pipeline logs."
            REDIRECT=""
            CTA='<a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" target="_blank">View Pipeline Logs</a>'
          fi

          BUILD_NUM="${{ github.run_number }}"
          BRANCH="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)

          cat > deploy_site/index.html << INDEXEOF
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  ${REDIRECT}
  <title>MoneyMap E2E Reports — Build #${BUILD_NUM}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0F172A;color:#F8FAFC;font-family:system-ui,sans-serif;
         display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .card{background:#1E293B;border:1px solid #334155;border-radius:20px;
          padding:48px 40px;text-align:center;max-width:520px;width:90%;}
    h1{font-size:24px;font-weight:700;margin-bottom:10px;color:#60A5FA;}
    .badge{display:inline-block;background:${BADGE_COLOR};color:#fff;
           font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;margin-bottom:18px;}
    .meta{color:#64748B;font-size:13px;margin-bottom:20px;line-height:1.9;}
    .meta b{color:#94A3B8;}
    p{color:#94A3B8;font-size:14px;margin-bottom:24px;}
    a{background:#3B82F6;color:#fff;text-decoration:none;padding:11px 26px;
      border-radius:10px;font-weight:600;display:inline-block;font-size:14px;}
    a:hover{background:#2563EB;}
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 MoneyMap E2E Reports</h1>
    <div class="badge">${BADGE_TEXT}</div>
    <div class="meta">
      Build <b>#${BUILD_NUM}</b> &nbsp;·&nbsp; Branch <b>${BRANCH}</b><br>
      Commit <b>${SHORT_SHA}</b>
    </div>
    <p>${STATUS_MSG}</p>
    ${CTA}
  </div>
</body>
</html>
INDEXEOF

          # History index page
          {
            echo "<!DOCTYPE html><html><head><meta charset='UTF-8'>"
            echo "<title>Build History</title>"
            echo "<style>body{background:#0F172A;color:#F8FAFC;font-family:system-ui,sans-serif;padding:32px;max-width:800px;margin:0 auto;}"
            echo "h1{color:#60A5FA;margin-bottom:24px;}ul{list-style:none;padding:0;}"
            echo "li{background:#1E293B;border:1px solid #334155;border-radius:10px;margin:8px 0;padding:14px 20px;}"
            echo "a{color:#60A5FA;text-decoration:none;font-weight:600;}a:hover{text-decoration:underline;}"
            echo ".back{margin-top:20px;display:inline-block;}</style></head><body>"
            echo "<h1>📊 MoneyMap Build History</h1><ul>"
          } > deploy_site/reports/history/index.html

          for build_dir in deploy_site/reports/history/build-*/; do
            bn=$(basename "$build_dir")
            if [ -f "$build_dir/execution-report.html" ]; then
              echo "<li><a href='${bn}/execution-report.html'>📋 ${bn}</a></li>" \
                >> deploy_site/reports/history/index.html
            fi
          done
          echo "</ul><p class='back'><a href='../latest/execution-report.html'>← Latest Report</a></p>" \
            >> deploy_site/reports/history/index.html
          echo "</body></html>" >> deploy_site/reports/history/index.html

          echo "✅ Deploy structure ready:"
          find deploy_site -name "*.html" | head -20

      - name: "🚀 Stage 20b · Deploy Reports to GitHub Pages"
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy_site
          clean: false
          commit-message: "📊 E2E Report Build #${{ github.run_number }} [${{ github.sha }}]"

      # ── Stage 21: GitHub Actions Summary ─────────────────────────────────────
      - name: "📋 Stage 21 · Publish GitHub Actions Summary"
        if: always()
        run: |
          SUMMARY_FILE="automation/Test Results/Summary/summary.md"
          REPO_NAME=$(echo '${{ github.repository }}' | cut -d/ -f2)
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/reports/latest/execution-report.html"

          cat >> "$GITHUB_STEP_SUMMARY" << SUMEOF
          ## 🤖 MoneyMap Android Appium E2E — Execution Summary

          | Field | Value |
          |---|---|
          | **Build Number** | #${{ github.run_number }} |
          | **Execution Date** | $(date '+%Y-%m-%d %H:%M:%S UTC') |
          | **Git Commit** | \`${{ github.sha }}\` |
          | **Branch** | \`${{ github.ref_name }}\` |
          | **APK Version** | v1.0 |
          | **APK Size** | ${{ env.APK_SIZE }} |
          | **Backend** | NestJS v11 + PostgreSQL 16 + Redis 7 |
          | **Device** | Android ${{ env.ANDROID_API_LEVEL }} Emulator (x86_64, UiAutomator2) |
          | **Test Cases** | 510+ |
          | **Live Report** | [View on GitHub Pages](${REPORT_URL}) |
          | **Build History** | [All Builds](https://${{ github.repository_owner }}.github.io/${REPO_NAME}/reports/history/index.html) |

          SUMEOF

          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            cat >> "$GITHUB_STEP_SUMMARY" << 'WARNEOF'
          ### ⚠️ Test summary not generated
          The Appium test suite did not complete. Check the **Logs** artifact for `mvn-execution.log`.
          WARNEOF
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << ENDEOF

          ---
          🔗 **Artifacts**: [Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          ENDEOF

          echo "✅ Summary published"
