name: "MoneyMap Security Review Pipeline"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-review:
    name: "Full Security Review"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Detect Framework"
        run: |
          if [ -f backend/nest-cli.json ]; then
            echo "FRAMEWORK=NestJS + TypeScript + Prisma + PostgreSQL" >> "$GITHUB_ENV"
          elif [ -f backend/pom.xml ]; then
            echo "FRAMEWORK=Spring Boot + Java" >> "$GITHUB_ENV"
          else
            echo "FRAMEWORK=Unknown" >> "$GITHUB_ENV"
          fi

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ── Unit Tests ────────────────────────────────────────────────────────
      - name: "Install Dependencies and Run Unit Tests"
        run: |
          cd backend
          npm ci --prefer-offline 2>/dev/null || npm install
          npx prisma generate 2>/dev/null || true
          npm test -- --passWithNoTests 2>&1 | tee /tmp/unit-test.log || true
          echo "Unit tests done"

      # ── Semgrep ───────────────────────────────────────────────────────────
      - name: "Semgrep SAST"
        run: |
          pip install semgrep --quiet
          semgrep scan --config "p/nodejs" --config "p/typescript" \
            --json --output semgrep-results.json backend/ || true
          test -f semgrep-results.json || echo '{"results":[]}' > semgrep-results.json

      # ── Trivy ─────────────────────────────────────────────────────────────
      - name: "Trivy Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "backend/"
          format: "json"
          output: "trivy-results.json"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"
        continue-on-error: true

      - name: "Ensure Trivy output"
        run: test -f trivy-results.json || echo '{"Results":[]}' > trivy-results.json

      # ── Gitleaks ──────────────────────────────────────────────────────────
      - name: "Gitleaks Scan"
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --report-format json --report-path gitleaks-results.json --redact --exit-code 0 || true
          test -f gitleaks-results.json || echo '[]' > gitleaks-results.json

      # ── k6 Performance (lightweight, 10 VUs, 20s) ────────────────────────
      - name: "Install k6"
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz | tar -xz
          mv k6-v0.52.0-linux-amd64/k6 /usr/local/bin/k6
          echo "k6 $(k6 version) ready"

      - name: "Performance Smoke Test (skip if backend down)"
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000" 2>/dev/null || echo "000")
          if echo "$CODE" | grep -qE "^[2345]"; then
            k6 run --vus 5 --duration 10s automation/load-tests/k6-load-test.js || true
          else
            echo "Backend not running — skipping performance test (safe)"
          fi

      # ── Evaluate ─────────────────────────────────────────────────────────
      - name: "Evaluate and Summarise"
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os

          def safe_load(path, default):
            try: return json.load(open(path))
            except: return default

          trivy = safe_load("trivy-results.json", {"Results": []})
          critical = sum(
            1 for r in trivy.get("Results", [])
            for v in r.get("Vulnerabilities", [])
            if v.get("Severity", "").upper() == "CRITICAL"
          )
          high = sum(
            1 for r in trivy.get("Results", [])
            for v in r.get("Vulnerabilities", [])
            if v.get("Severity", "").upper() == "HIGH"
          )
          secrets = safe_load("gitleaks-results.json", [])
          secret_count = len(secrets) if isinstance(secrets, list) else 0
          semgrep = safe_load("semgrep-results.json", {"results": []})
          sast = len(semgrep.get("results", []))

          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a") as f:
            f.write(f"TRIVY_CRITICAL={critical}\n")
            f.write(f"TRIVY_HIGH={high}\n")
            f.write(f"GITLEAKS_COUNT={secret_count}\n")
            f.write(f"SEMGREP_COUNT={sast}\n")
            f.write(f"CRITICAL_FOUND={'true' if critical > 0 or secret_count > 0 else 'false'}\n")

          print(f"Trivy Critical={critical} High={high} | Secrets={secret_count} | SAST={sast}")
          EOF

      - name: "Publish Step Summary"
        if: always()
        run: |
          {
            echo "## 🔒 MoneyMap Security Review Summary"
            echo ""
            echo "**Framework:** ${{ env.FRAMEWORK }}"
            echo ""
            echo "| Tool | Findings |"
            echo "|---|---|"
            echo "| Semgrep SAST | ${{ env.SEMGREP_COUNT }} |"
            echo "| Trivy Critical | ${{ env.TRIVY_CRITICAL }} |"
            echo "| Trivy High | ${{ env.TRIVY_HIGH }} |"
            echo "| Gitleaks Secrets | ${{ env.GITLEAKS_COUNT }} |"
            echo ""
            if [ "${{ env.CRITICAL_FOUND }}" = "true" ]; then
              echo "### ❌ FAILED — Critical findings detected"
            else
              echo "### ✅ PASSED — No critical findings"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-${{ github.run_number }}
          path: |
            semgrep-results.json
            trivy-results.json
            gitleaks-results.json
            security-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: "Fail Only on Critical"
        if: env.CRITICAL_FOUND == 'true'
        run: |
          echo "❌ Critical security findings — pipeline failed"
          exit 1
