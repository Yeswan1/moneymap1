name: "MoneyMap Backend Security Scan"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: "Backend Security Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Semgrep SAST ──────────────────────────────────────────────────────
      - name: "Semgrep SAST Scan"
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config "p/nodejs" \
            --config "p/typescript" \
            --json \
            --output semgrep-results.json \
            backend/ || true
          test -f semgrep-results.json || echo '{"results":[]}' > semgrep-results.json
          python3 -c 'import json; d=json.load(open("semgrep-results.json")); print("Semgrep:", len(d.get("results",[])), "findings")'

      # ── Trivy ─────────────────────────────────────────────────────────────
      - name: "Trivy Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "backend/"
          format: "json"
          output: "trivy-results.json"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"
        continue-on-error: true

      - name: "Ensure Trivy output exists"
        run: test -f trivy-results.json || echo '{"Results":[]}' > trivy-results.json

      # ── Gitleaks ──────────────────────────────────────────────────────────
      - name: "Gitleaks Secret Scan"
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --report-format json --report-path gitleaks-results.json --redact --exit-code 0 || true
          test -f gitleaks-results.json || echo '[]' > gitleaks-results.json
          python3 -c 'import json; d=json.load(open("gitleaks-results.json")); print("Gitleaks:", len(d) if isinstance(d,list) else 0, "secrets")'

      # ── Count findings and decide pass/fail ───────────────────────────────
      - name: "Evaluate Thresholds"
        run: |
          python3 - <<'EOF'
          import json, os

          try:
            trivy = json.load(open("trivy-results.json"))
            critical = sum(
              1 for r in trivy.get("Results", [])
              for v in r.get("Vulnerabilities", [])
              if v.get("Severity", "").upper() == "CRITICAL"
            )
          except:
            critical = 0

          try:
            secrets = json.load(open("gitleaks-results.json"))
            secret_count = len(secrets) if isinstance(secrets, list) else 0
          except:
            secret_count = 0

          try:
            semgrep = json.load(open("semgrep-results.json"))
            sast_count = len(semgrep.get("results", []))
          except:
            sast_count = 0

          print(f"Trivy Critical: {critical}")
          print(f"Gitleaks Secrets: {secret_count}")
          print(f"Semgrep Findings: {sast_count}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"TRIVY_CRITICAL={critical}\n")
            f.write(f"GITLEAKS_SECRETS={secret_count}\n")
            f.write(f"SEMGREP_FINDINGS={sast_count}\n")
            f.write(f"CRITICAL_FOUND={'true' if critical > 0 or secret_count > 0 else 'false'}\n")
          EOF

      # ── Step Summary ──────────────────────────────────────────────────────
      - name: "Publish Step Summary"
        if: always()
        run: |
          {
            echo "## 🔒 MoneyMap Backend Security Scan"
            echo ""
            echo "| Tool | Findings |"
            echo "|---|---|"
            echo "| Semgrep SAST | ${{ env.SEMGREP_FINDINGS }} |"
            echo "| Trivy Critical | ${{ env.TRIVY_CRITICAL }} |"
            echo "| Gitleaks Secrets | ${{ env.GITLEAKS_SECRETS }} |"
            echo ""
            if [ "${{ env.CRITICAL_FOUND }}" = "true" ]; then
              echo "### ❌ FAILED — Critical findings require remediation"
            else
              echo "### ✅ PASSED — No critical findings"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: "Upload Scan Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results-${{ github.run_number }}
          path: |
            semgrep-results.json
            trivy-results.json
            gitleaks-results.json
          retention-days: 30
          if-no-files-found: warn

      # ── Fail only on critical ─────────────────────────────────────────────
      - name: "Fail on Critical"
        if: env.CRITICAL_FOUND == 'true'
        run: |
          echo "❌ Critical findings detected — see summary above"
          exit 1
